plugins { id 'com.android.application' }
android {
    namespace 'io.retroone.android'
    compileSdk 36
    defaultConfig {
        applicationId 'io.retroone.android'
        minSdk 26
        targetSdk 35
        versionCode 9
        versionName '0.2.7'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
    testOptions { unitTests.returnDefaultValues = true }
    lint { abortOnError true }
}
// Only our CC0 diagnostic program is generated; no downloaded game or firmware assets.
def probeAssets = layout.buildDirectory.dir('generated/nesProbeAssets')
def generateNesProbe = tasks.register('generateNesProbe', Exec) {
    inputs.files('../tools/create_nes_fixture.py', '../tools/create_psp_fixture.py')
    outputs.dir(probeAssets)
    commandLine 'python3', '../tools/create_nes_fixture.py',
        probeAssets.get().file('retroone-nes-probe.nes').asFile, '--replace'
}
android.sourceSets.main.assets.srcDir(probeAssets)
tasks.named('preBuild').configure { dependsOn(generateNesProbe) }
def handheldAssets = layout.buildDirectory.dir('generated/handheldProbeAssets')
def generateHandheldProbes = tasks.register('generateHandheldProbes', Exec) {
    inputs.files('../tools/create_handheld_sega_fixtures.py', '../tools/create_psp_fixture.py')
    outputs.dir(handheldAssets)
    commandLine 'python3', '../tools/create_handheld_sega_fixtures.py', handheldAssets.get().asFile, '--replace'
}
def snesPceAssets = layout.buildDirectory.dir('generated/snesPceProbeAssets')
def generateSnesPceProbes = tasks.register('generateSnesPceProbes', Exec) {
    inputs.files('../tools/create_snes_pce_fixtures.py', '../tools/create_psp_fixture.py')
    outputs.dir(snesPceAssets)
    commandLine 'python3', '../tools/create_snes_pce_fixtures.py', snesPceAssets.get().asFile, '--replace'
}
android.sourceSets.main.assets.srcDir(handheldAssets)
android.sourceSets.main.assets.srcDir(snesPceAssets)
tasks.named('preBuild').configure { dependsOn(generateHandheldProbes, generateSnesPceProbes) }
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
