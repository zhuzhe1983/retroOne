<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1427"><title>RetroOne · Offline</title><link rel="icon" href="/favicon.svg">
<style>html{color-scheme:dark;background:#0b1427;color:#e7f2ff;font:16px/1.7 system-ui}body{margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;box-sizing:border-box}main{max-width:32rem}img{width:64px;height:64px}h1{font-size:1.7rem;line-height:1.3}p{color:#afc2d9}a{display:inline-block;padding:.7rem 1.2rem;margin-top:1rem;background:#a3dfff;color:#0b1427;border-radius:12px;text-decoration:none;font-weight:600}small{display:block;margin-top:1.2rem;color:#9baec6}</style></head>
<body><main><img src="/favicon.svg" alt=""><h1 id="title">暂时无法连接游戏服务</h1><p id="explanation">游玩需要连接你的游戏服务器。请检查网络或服务器是否在线，再返回游戏库。</p><p id="privacy">离线缓存只包含此提示页和应用图标，没有保存游戏、玩家资料或存档。</p><a href="/" id="retry">重新连接游戏库</a><small id="note">正在运行的游戏不会因应用更新而自动刷新。</small></main>
<script>if(/^en(?:-|$)/i.test((navigator.languages||[navigator.language]).find(x=>/^(?:en|zh)(?:-|$)/i.test(x))||'')){document.documentElement.lang='en';document.getElementById('title').textContent='Game server unavailable';document.getElementById('explanation').textContent='Playing requires a connection to your game server. Check your network or server, then return to the library.';document.getElementById('privacy').textContent='The offline cache contains only this notice and app icons. Games, player details and saves are not cached.';document.getElementById('retry').textContent='Reconnect to the library';document.getElementById('note').textContent='App updates never automatically reload a running game.'}</script></body></html>
